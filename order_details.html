<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASGate - تفاصيل الطلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --nav-shiny-navy: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            --header-shiny-purple: linear-gradient(180deg, #4c1d95 0%, #2e1065 100%);
            --nav-bg: #0f172a;
            --nav-active: #a78bfa;
            --bg-color: #f8fafc;
            --white: #ffffff;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-green-active: #22c55e;
            --border-soft: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        html, body {
            height: 100%; margin: 0; padding: 0; overflow: hidden;
            background-color: var(--bg-color); font-family: 'Cairo', sans-serif;
            font-size: 12px; line-height: 1.2; color: var(--text-dark);
        }

        .dashboard-container { display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }

        .navbar {
            background: var(--nav-shiny-navy); display: flex; align-items: center; padding: 0 20px;
            margin: 10px 10px 5px; border-radius: 10px; height: 40px; flex-shrink: 0;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
            border: 1px solid #1e293b;
        }
        .navbar a { color: white; text-decoration: none; padding: 0 15px; font-weight: 700; font-size: 11.5px; height: 28px; line-height: 28px; display: inline-block; transition: .3s; opacity: .85; }
        .navbar a:hover { opacity: 1; }
        .navbar a.active { background-color: var(--nav-active); color: #0f172a; border-radius: 6px; opacity: 1; box-shadow: 0 2px 4px rgba(0,0,0,.1); }

        .main-content { flex: 1; display: flex; flex-direction: column; padding: 0 15px 10px; min-height: 0; gap: 8px; }

        /* شريط الأدوات والمعلومات العلوي */
        .action-bar { display: flex; align-items: center; gap: 12px; flex-shrink: 0; margin-top: 5px; }

        .btn-top { border: none; padding: 0 18px; border-radius: 8px; font-family: 'Cairo'; font-weight: 800; cursor: pointer; color: white; transition: all .2s; font-size: 12px; height: 38px; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 4px rgba(59,130,246,.3); }
        .btn-add { background-color: var(--accent-blue); }
        .btn-add:hover { background-color: var(--accent-blue-hover); transform: translateY(-1px); box-shadow: 0 4px 6px rgba(59,130,246,.4); }

        .search-wrapper { position: relative; width: 220px; display: flex; align-items: center; }
        .search-input { width: 100%; height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-soft); background: #fff; font-family: 'Cairo'; font-size: 11.5px; font-weight: 600; outline: none; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.02); }
        .search-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(59,130,246,.1); }

        .order-info-card {
            margin-right: auto; display: flex; gap: 15px; align-items: center; background: #fff;
            padding: 0 18px; border-radius: 8px; height: 38px; border: 1px solid var(--border-soft); box-shadow: 0 1px 2px rgba(0,0,0,.02);
        }
        .order-info-item { font-size: 11px; font-weight: 700; color: var(--text-muted); white-space: nowrap; display: flex; gap: 5px; align-items: center; }
        .order-info-val { color: var(--text-dark); font-weight: 800; font-size: 12px; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }

        /* جدول المنتجات */
        .table-wrapper { background: white; border-radius: 10px; overflow-y: auto; border: 1px solid var(--border-soft); flex: 1; min-height: 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,.05); position: relative; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }

        th { background: var(--header-shiny-purple); color: white; padding: 0 8px; font-size: 10.5px; font-weight: 800; text-align: center; border-bottom: 3px solid #2e1065; position: sticky; top: 0; z-index: 50; height: 42px; letter-spacing: .3px; }
        td { border-bottom: 1px solid #f1f5f9; text-align: center; height: 38px; max-height: 38px; font-size: 10.5px; font-weight: 600; overflow: visible; white-space: nowrap; position: relative; transition: background-color .2s; }
        tbody tr:hover td { background-color: #f1f5f9; }
        tbody tr:nth-child(even) { background-color: #fafafa; }

        .excel-input { width: 96%; border: 1px solid transparent; border-radius: 4px; text-align: center; font-family: 'Cairo'; outline: none; background: transparent; font-size: 11px; color: inherit; font-weight: inherit; height: 90%; margin: 1.5% 2%; overflow: hidden; text-overflow: ellipsis; transition: all .2s; }
        .excel-input:focus { border-color: var(--accent-blue); background: #fff; box-shadow: 0 0 0 2px rgba(59,130,246,.1); }
        .readonly-input { color: var(--text-muted); font-weight: 700; cursor: not-allowed; }

        .sub-action-btn { width: 24px; height: 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; justify-content: center; transition: .2s; background: #fee2e2; color: #ef4444; }
        .sub-action-btn:hover { background: #fecaca; transform: scale(1.05); }

        /* --- الشريط الأسود الملتصق بأسفل الجدول لحساب المجاميع الإجمالية --- */
        .products-summary-bar {
            background: #0f172a;
            color: #ffffff;
            border-radius: 8px;
            padding: 0 18px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            border: 1px solid #1e293b;
            box-sizing: border-box;
        }
        .summary-group { display: flex; align-items: center; gap: 20px; }
        .summary-item { font-size: 11px; font-weight: 700; color: #94a3b8; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
        .summary-val { color: #38bdf8; font-weight: 800; font-size: 12px; background: rgba(255, 255, 255, 0.1); padding: 2px 8px; border-radius: 4px; }
        .summary-val-green { color: #4ade80; font-weight: 800; font-size: 12.5px; background: rgba(34, 197, 94, 0.15); padding: 2px 10px; border-radius: 4px; }

        /* --- سجل نشاط تفاصيل الطلب (نفس تنسيق خط وحجم الزيارات تماماً) --- */
        .activity-log-section {
            margin: 0; padding: 6px 20px; background: #ffffff; border-radius: 10px;
            border: 1px solid var(--border-soft); box-shadow: 0 2px 8px rgba(0,0,0,.04);
            flex-shrink: 0; height: 80px; display: flex; flex-direction: column;
            box-sizing: border-box; transition: height .3s cubic-bezier(.4,0,.2,1);
        }
        .activity-log-section.expanded { height: 200px; }
        .activity-log-header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px; flex-shrink: 0; }
        .activity-log-title { color: #4c1d95; font-family: 'Cairo'; font-size: 11.5px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 6px; }
        .btn-toggle-expand { background: #f1f5f9; border: none; color: #64748b; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; transition: .2s; }
        .btn-toggle-expand:hover { background: #e2e8f0; color: #0f172a; }
        .activity-list { flex: 1; overflow-y: auto; text-align: right; padding-left: 5px; }

        .log-entry { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--border-soft); flex-wrap: wrap; }
        .log-entry:last-child { border-bottom: none; }
        .log-badge-user { background: #e0e7ff; color: #3730a3; padding: 2px 8px; border-radius: 4px; font-size: 9px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .log-divider { color: #cbd5e1; font-size: 10px; font-weight: 800; }
        .log-timestamp { color: #64748b; font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }
        .log-action { color: #0f172a; font-size: 10px; font-weight: 700; flex: 1; line-height: 1.5; }

        /* أعمدة الجدول */
        .col-num { width: 5%; }
        .col-type { width: 15%; }
        .col-desc { width: 35%; }
        .col-qty { width: 12%; }
        .col-sub { width: 15%; }
        .col-total { width: 13%; }
        .col-action { width: 5%; }
    </style>
</head>
<body onload="initOrderDetailsPage()">

<div class="dashboard-container">
    <nav class="navbar">
        <a href="index.html">الرئيسية</a>
        <a href="visits.html">الزيارات</a>
        <a href="opportunities.html">الفرص البيعية</a>
        <a href="customers.html">العملاء</a>
        <a href="sales.html">المبيعات</a>
        <a href="order_details.html" class="active">تفاصيل الطلب</a>
    </nav>

    <div class="main-content">
        <!-- شريط الأدوات العلوي -->
        <div class="action-bar">
            <button class="btn-top btn-add" onclick="addNewProductRow()"><i class="fas fa-plus"></i> إضافة منتج جديد</button>
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="بحث في المنتجات 🔍" onkeyup="filterProductsTable()">
            </div>
            
            <div class="order-info-card">
                <div class="order-info-item">العميل: <span id="info-customer" class="order-info-val">شركة التقنية المتقدمة</span></div>
                <div class="order-info-item">رقم الطلب: <span id="info-order-id" class="order-info-val">ORD-2026-089</span></div>
                <div class="order-info-item">التاريخ: <span id="info-order-date" class="order-info-val">2026-07-29</span></div>
            </div>
        </div>
        
        <!-- جدول المنتجات الرئيسي -->
        <div class="table-wrapper">
            <table id="productsTable">
                <thead>
                    <tr>
                        <th class="col-num">#</th>
                        <th class="col-type">المنتج</th>
                        <th class="col-desc">التفاصيل / الوصف</th>
                        <th class="col-qty">العدد</th>
                        <th class="col-sub">الاشتراك / السعر</th>
                        <th class="col-total">الإجمالي</th>
                        <th class="col-action">حذف</th>
                    </tr>
                </thead>
                <tbody id="productsBody"></tbody>
            </table>
        </div>

        <!-- الشريط الأسود المثبت أسفل الجدول لحساب الأعداد والمجاميع -->
        <div class="products-summary-bar">
            <div class="summary-group">
                <div class="summary-item"><i class="fas fa-boxes" style="color:#38bdf8;"></i> إجمالي المنتجات: <span id="sum-count" class="summary-val">0</span></div>
                <div class="summary-item"><i class="fas fa-calculator" style="color:#38bdf8;"></i> إجمالي الأعداد / الكميات: <span id="sum-qty" class="summary-val">0</span></div>
            </div>
            <div class="summary-group">
                <div class="summary-item"><i class="fas fa-coins" style="color:#4ade80;"></i> القيمة الإجمالية للطلب: <span id="sum-total-value" class="summary-val-green">0 ر.س</span></div>
            </div>
        </div>

        <!-- سجل نشاط تفاصيل الطلب -->
        <div id="activityLogSection" class="activity-log-section">
            <div class="activity-log-header-container">
                <div class="activity-log-title"><i class="fas fa-history"></i> سجل نشاط تفاصيل الطلب</div>
                <button id="toggleExpandBtn" class="btn-toggle-expand" onclick="toggleLogExpansion()" title="توسيع / تقليص"><i class="fas fa-expand-alt"></i></button>
            </div>
            <div id="activityList" class="activity-list"></div>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY_ORDER = 'asgate_order_details_v1';
    const LOGS_KEY_ORDER = 'asgate_order_details_logs_v1';
    let saveTimeout;

    function initOrderDetailsPage() {
        loadSavedData();
    }

    /* --- دالة إضافة وإعادة بناء أسطر المنتجات --- */
    function renderProductRow(p = {}, prepend = false) {
        const tbody = document.getElementById('productsBody');
        if (!tbody) return;

        const rowId = 'prod-' + Date.now() + Math.random().toString(36).substr(2, 5);
        const row = document.createElement('tr');
        row.id = rowId;

        row.innerHTML = `
            <td class="col-num" style="font-weight:bold; color:var(--text-muted);">1</td>
            <td>
                <select class="excel-input prod-type" data-old="${p.type || ''}" onfocus="this.dataset.old=this.value" onchange="addToActivityLog('نوع المنتج', this.dataset.old, this.value, getProductDesc(this)); this.dataset.old=this.value; debouncedSaveAll();">
                    <option value="" ${!p.type ? 'selected' : ''}>- اختر المنتج -</option>
                    <option value="جوال" ${p.type === 'جوال' ? 'selected' : ''}>جوال</option>
                    <option value="بيانات" ${p.type === 'بيانات' ? 'selected' : ''}>بيانات</option>
                    <option value="هاتف" ${p.type === 'هاتف' ? 'selected' : ''}>هاتف</option>
                    <option value="فايبر نت" ${p.type === 'فايبر نت' ? 'selected' : ''}>فايبر نت</option>
                    <option value="DIA" ${p.type === 'DIA' ? 'selected' : ''}>DIA</option>
                    <option value="IPVPN" ${p.type === 'IPVPN' ? 'selected' : ''}>IPVPN</option>
                    <option value="SIP" ${p.type === 'SIP' ? 'selected' : ''}>SIP</option>
                </select>
            </td>
            <td>
                <input type="text" class="excel-input prod-desc" value="${p.desc || ''}" data-old="${p.desc || ''}" onfocus="this.dataset.old=this.value" onkeyup="debouncedSaveAll();" onblur="addToActivityLog('وصف المنتج', this.dataset.old, this.value, this.value || 'منتج جديد'); this.dataset.old=this.value;">
            </td>
            <td>
                <input type="number" class="excel-input prod-qty" min="0" value="${p.qty || ''}" data-old="${p.qty || ''}" onfocus="this.dataset.old=this.value" oninput="calculateRowAndSummary('${rowId}'); debouncedSaveAll();" onblur="addToActivityLog('عدد/كمية المنتج', this.dataset.old, this.value, getProductDesc(this)); this.dataset.old=this.value;">
            </td>
            <td>
                <input type="number" class="excel-input prod-sub" min="0" value="${p.sub || ''}" data-old="${p.sub || ''}" onfocus="this.dataset.old=this.value" oninput="calculateRowAndSummary('${rowId}'); debouncedSaveAll();" onblur="addToActivityLog('اشتراك/سعر المنتج', this.dataset.old, this.value, getProductDesc(this)); this.dataset.old=this.value;">
            </td>
            <td>
                <input type="number" class="excel-input prod-total readonly-input" value="${p.total || ''}" readonly>
            </td>
            <td>
                <button class="sub-action-btn" title="حذف المنتج" onclick="removeProductRow('${rowId}')"><i class="fas fa-trash-alt"></i></button>
            </td>
        `;

        if (prepend && tbody.firstChild) {
            tbody.insertBefore(row, tbody.firstChild);
        } else {
            tbody.appendChild(row);
        }

        calculateRowAndSummary(rowId);
        updateRowNumbers();
    }

    function addNewProductRow() {
        renderProductRow({}, true);
        addToActivityLog('إجراء', 'إضافة', 'منتج جديد', 'جديد');
        debouncedSaveAll();
    }

    function removeProductRow(rowId) {
        const row = document.getElementById(rowId);
        if (!row) return;
        const desc = getProductDesc(row.querySelector('.prod-desc'));
        row.remove();
        updateRowNumbers();
        updateTotalsSummary();
        addToActivityLog('إجراء', 'حذف المنتج', desc, desc);
        debouncedSaveAll();
    }

    function updateRowNumbers() {
        const rows = document.querySelectorAll('#productsBody tr');
        rows.forEach((row, index) => {
            const cell = row.querySelector('.col-num');
            if (cell) cell.innerText = index + 1;
        });
    }

    function getProductDesc(element) {
        if (!element) return 'تفاصيل المنتج';
        const tr = element.closest('tr');
        if (!tr) return 'تفاصيل المنتج';
        const descVal = tr.querySelector('.prod-desc')?.value;
        const typeVal = tr.querySelector('.prod-type')?.value;
        return descVal || typeVal || 'منتج غير مسمى';
    }

    /* --- دوال الحسابات والتجميع الإجمالي --- */
    function calculateRowAndSummary(rowId) {
        const row = document.getElementById(rowId);
        if (!row) return;
        const qty = parseFloat(row.querySelector('.prod-qty')?.value) || 0;
        const sub = parseFloat(row.querySelector('.prod-sub')?.value) || 0;
        const totalInput = row.querySelector('.prod-total');
        const rowTotal = qty * sub;
        
        if (totalInput) totalInput.value = rowTotal > 0 ? rowTotal : '';
        updateTotalsSummary();
    }

    function updateTotalsSummary() {
        const rows = document.querySelectorAll('#productsBody tr');
        let totalCount = rows.length;
        let totalQty = 0;
        let grandTotalValue = 0;

        rows.forEach(r => {
            const qty = parseFloat(r.querySelector('.prod-qty')?.value) || 0;
            const rowTot = parseFloat(r.querySelector('.prod-total')?.value) || 0;
            totalQty += qty;
            grandTotalValue += rowTot;
        });

        document.getElementById('sum-count').innerText = totalCount;
        document.getElementById('sum-qty').innerText = totalQty.toLocaleString();
        document.getElementById('sum-total-value').innerText = grandTotalValue.toLocaleString() + ' ر.س';
    }

    /* --- دوال سجل النشاط والتوسيع --- */
    function toggleLogExpansion() {
        const logSection = document.getElementById('activityLogSection');
        const toggleBtn = document.getElementById('toggleExpandBtn');
        if (logSection.classList.contains('expanded')) {
            logSection.classList.remove('expanded');
            toggleBtn.innerHTML = '<i class="fas fa-expand-alt"></i>';
        } else {
            logSection.classList.add('expanded');
            toggleBtn.innerHTML = '<i class="fas fa-compress-alt"></i>';
        }
    }

    function addToActivityLog(fieldName, oldVal, newVal, productName) {
        if (oldVal === newVal) return;
        const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const d = new Date();
        let dd = String(d.getDate()).padStart(2, '0');
        let mm = String(d.getMonth() + 1).padStart(2, '0');
        let yyyy = d.getFullYear();
        const dayName = days[d.getDay()];
        const timeStr = String(d.getHours()).padStart(2, '0') + ":" + String(d.getMinutes()).padStart(2, '0');
        const cleanProduct = productName || 'تفاصيل المنتج';
        
        let actionText = fieldName === 'إجراء' 
            ? `${oldVal} تفاصيل المنتج ( ${cleanProduct} )` 
            : `تعديل ${fieldName} من [${oldVal || 'فارغ'}] إلى [${newVal || 'فارغ'}] لـ ( ${cleanProduct} )`;

        const fullLogHTML = `
            <div class="log-entry">
                <span class="log-badge-user"><i class="fas fa-user-circle"></i> المستخدم</span>
                <span class="log-divider">|</span>
                <span class="log-timestamp"><i class="fas fa-clock"></i> ${dayName} ${yyyy}-${mm}-${dd} ${timeStr}</span>
                <span class="log-divider">|</span>
                <span class="log-action">${actionText}</span>
            </div>
        `;

        let logs = JSON.parse(localStorage.getItem(LOGS_KEY_ORDER) || '[]');
        logs.unshift(fullLogHTML);
        localStorage.setItem(LOGS_KEY_ORDER, JSON.stringify(logs.slice(0, 100)));
        renderActivityLog();
    }

    function renderActivityLog() {
        const list = document.getElementById('activityList');
        if (!list) return;
        const logs = JSON.parse(localStorage.getItem(LOGS_KEY_ORDER) || '[]');
        list.innerHTML = logs.join('');
    }

    /* --- التخزين المحلي والفلترة --- */
    function saveAllDataSilently() {
        const data = Array.from(document.querySelectorAll('#productsBody tr')).map(row => ({
            type: row.querySelector('.prod-type')?.value || '',
            desc: row.querySelector('.prod-desc')?.value || '',
            qty: row.querySelector('.prod-qty')?.value || '',
            sub: row.querySelector('.prod-sub')?.value || '',
            total: row.querySelector('.prod-total')?.value || ''
        }));
        localStorage.setItem(STORAGE_KEY_ORDER, JSON.stringify(data));
    }

    function debouncedSaveAll() {
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            saveAllDataSilently();
            updateTotalsSummary();
        }, 500);
    }

    function loadSavedData() {
        const rawData = localStorage.getItem(STORAGE_KEY_ORDER);
        const tbody = document.getElementById('productsBody');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (rawData && JSON.parse(rawData).length > 0) {
            JSON.parse(rawData).forEach(p => renderProductRow(p, false));
        } else {
            // صفوف افتراضية في حال كانت الصفحة جديدة
            renderProductRow({ type: 'فايبر نت', desc: 'باقة أعمال 200 ميجا', qty: 2, sub: 1500, total: 3000 });
            renderProductRow({ type: 'جوال', desc: 'خطوط مفوترة لقطاع المبيعات', qty: 5, sub: 250, total: 1250 });
        }
        updateTotalsSummary();
        renderActivityLog();
    }

    function filterProductsTable() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        document.querySelectorAll('#productsBody tr').forEach(row => {
            const text = Array.from(row.querySelectorAll('input, select')).map(i => i.value.toLowerCase()).join(' ');
            row.style.display = text.includes(q) ? 'table-row' : 'none';
        });
    }
</script>

</body>
</html>
